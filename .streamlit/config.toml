[theme]
base = "light"
primaryColor = "#0284c7"
backgroundColor = "#f7f9ff"
secondaryBackgroundColor = "#eef2fb"
textColor = "#0f172a"
font = "sans serif"

[browser]
# Nothing leaves this computer: no usage statistics.
gatherUsageStats = false

[server]
# Only this computer can open the app; health data is never served to the network.
address = "localhost"
headless = false
maxUploadSize = 200

[client]
toolbarMode = "minimal"
